<div class="sdas-header" role="banner">
  <a class="sdas-brand" href="https://sdas.thinkific.com/courses/precmedintro" aria-label="Smart Data Analysis and Statistics">
    <img src="sdas_large.png" alt="Smart Data Analysis and Statistics" class="sdas-logo">
  </a>
</div>

<style>
  :root {
    --sdas-navy: #26476b;
    --sdas-green: #80c42b;
    --sdas-dark: #212529;
    --sdas-muted: #5d6873;
    --sdas-light-blue: #eef4f8;
    --sdas-light-green: #f3f9e9;
    --sdas-border: #d8e1e8;
  }

  /* Desktop page frame: full-width brand header, readable article column,
     and a compact table of contents. */
  #quarto-content {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) 235px;
    grid-template-rows: auto auto;
    column-gap: 3.5rem;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  #quarto-content > .sdas-header {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  #quarto-content > #quarto-document-content {
    grid-column: 1;
    grid-row: 2;
    width: 100%;
    max-width: 820px;
    padding-top: 2.5rem;
  }

  #quarto-content > #quarto-margin-sidebar {
    grid-column: 2;
    grid-row: 2;
    width: 100%;
    padding-top: 2.5rem;
    border-left: 1px solid var(--sdas-border);
    padding-left: 1.25rem;
  }

  #quarto-margin-sidebar #toc-title {
    margin-top: 0;
    color: var(--sdas-navy);
    font-size: 1.05rem;
  }

  #quarto-margin-sidebar a {
    color: var(--sdas-navy);
  }

  #quarto-margin-sidebar a:hover,
  #quarto-margin-sidebar a:focus,
  #quarto-margin-sidebar .active {
    color: #5c8f18;
  }

  .sdas-header {
    width: 100%;
    margin: 0 auto;
    padding: 1.15rem 0 0;
  }

  .sdas-brand {
    display: inline-flex;
    align-items: center;
    color: var(--sdas-navy);
    text-decoration: none;
  }

  .sdas-brand:hover,
  .sdas-brand:focus {
    color: var(--sdas-green);
    text-decoration: none;
  }

  .sdas-header::after {
    display: block;
    height: 4px;
    margin-top: 1rem;
    background: var(--sdas-green);
    border-radius: 999px;
    content: "";
  }

  .sdas-logo {
    display: block;
    width: min(15rem, 72vw);
    height: auto;
  }

  #quarto-document-content h1,
  #quarto-document-content h2,
  #quarto-document-content h3 {
    color: var(--sdas-navy);
    line-height: 1.25;
  }

  #quarto-document-content h1 {
    margin-top: 0;
  }

  #quarto-document-content h2 {
    border-left: 5px solid var(--sdas-green);
    padding-left: 0.75rem;
  }

  #quarto-document-content a {
    color: var(--sdas-navy);
  }

  #quarto-document-content a:hover,
  #quarto-document-content a:focus {
    color: #5c8f18;
  }

  #quarto-document-content .callout {
    border-color: var(--sdas-border);
    border-left-width: 5px;
    border-radius: 0.35rem;
  }

  #quarto-document-content .callout.callout-note {
    border-left-color: var(--sdas-navy);
    background: var(--sdas-light-blue);
  }

  #quarto-document-content .callout.callout-tip {
    border-left-color: var(--sdas-green);
    background: var(--sdas-light-green);
  }

  #quarto-document-content pre.sourceCode,
  #quarto-document-content div.sourceCode {
    border-color: var(--sdas-border);
    background: #f6f8fa;
  }

  #quarto-document-content table {
    border-color: var(--sdas-border);
  }

  #quarto-document-content table thead th {
    color: #fff;
    background: var(--sdas-navy);
  }

  #quarto-document-content table tbody tr:nth-child(even) {
    background: var(--sdas-light-blue);
  }

  @media (max-width: 991px) {
    #quarto-content {
      display: block !important;
      max-width: none;
      padding: 0 1rem 3rem;
    }

    #quarto-content > #quarto-document-content {
      max-width: none;
      padding-top: 2rem;
    }

    #quarto-content > #quarto-margin-sidebar {
      margin-top: 3rem;
      padding: 1rem 0 0;
      border-top: 1px solid var(--sdas-border);
      border-left: 0;
    }

    .sdas-logo {
      width: min(13rem, 70vw);
    }
  }

  /* Keep the index in the full-width preview layout, while practical pages
     place the logo above the table of contents in the right sidebar. */
  body.sdas-practical #quarto-content {
    grid-template-rows: auto;
  }

  body.sdas-practical #quarto-content > #quarto-document-content {
    grid-row: 1;
  }

  body.sdas-practical #quarto-content > #quarto-margin-sidebar {
    grid-row: 1;
    padding-top: 0;
  }

  body.sdas-practical #quarto-margin-sidebar > .sdas-header {
    display: block;
    width: 100%;
    margin: 0 0 1rem;
    padding: 0 0 0.75rem;
    border-bottom: 1px solid var(--sdas-border);
  }

  body.sdas-practical .sdas-logo {
    width: min(12rem, 100%);
  }

  @media (max-width: 991px) {
    body.sdas-practical #quarto-content > #quarto-document-content {
      padding-top: 2rem;
    }

    body.sdas-practical #quarto-content > #quarto-margin-sidebar {
      padding-top: 0;
    }

    body.sdas-practical .sdas-logo {
      width: min(13rem, 70vw);
    }
  }
</style>

<script>
  (() => {
    const placeLogo = () => {
      const logo = document.querySelector('.sdas-header');
      const page = document.querySelector('#quarto-content');
      const sidebar = document.querySelector('#quarto-margin-sidebar');
      const main = document.querySelector('#quarto-document-content');
      const title = document.querySelector('#title-block-header .title');
      const isIndex = /(^|\/)index\.html$/.test(window.location.pathname) ||
        window.location.pathname.endsWith('/') ||
        title?.textContent.trim() === 'Welcome';

      if (!logo || !page || !sidebar || !main) return;

      document.body.classList.toggle('sdas-index', isIndex);
      document.body.classList.toggle('sdas-practical', !isIndex);

      if (isIndex && logo.parentElement !== page) {
        page.prepend(logo);
      } else if (!isIndex) {
        const target = window.matchMedia('(min-width: 992px)').matches ? sidebar : main;
        if (logo.parentElement !== target) target.prepend(logo);
      }
    };

    placeLogo();
    window.addEventListener('resize', placeLogo);
  })();
</script>
